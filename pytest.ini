[pytest]
# Deixa importar "pages" e "api" a partir da raiz do projeto
pythonpath = .
testpaths = tests

# Endereço do site testado na interface (usado por page.goto("/"))
base_url = https://www.saucedemo.com

# --screenshot e --tracing guardam evidências só quando um teste falha
addopts =
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
    --html=reports/relatorio.html
    --self-contained-html

markers =
    ui: testes de interface (Playwright + Sauce Demo)
    api: testes de API (requests + ServeRest)
